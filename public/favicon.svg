<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Gradiente de Neón Rojo -->
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Contenedor Hexagonal Industrial -->
  <polygon points="64,10 116,40 116,96 64,126 12,96 12,40" 
           stroke="url(#neonRed)" 
           stroke-width="6" 
           fill="#07090e" 
           stroke-linejoin="round" />

  <!-- Líneas Técnicas Internas de Telemetría -->
  <line x1="64" y1="10" x2="64" y2="40" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="12" y1="40" x2="42" y2="58" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="116" y1="40" x2="86" y2="58" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="12" y1="96" x2="42" y2="78" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="116" y1="96" x2="86" y2="78" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Brackets de Código (Software Craftsmanship) -->
  <path d="M46,44 L28,64 L46,84" 
        stroke="#ff6b6b" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <path d="M82,44 L100,64 L82,84" 
        stroke="#ff6b6b" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Núcleo de Telemetría IoT (Active Node) -->
  <circle cx="64" cy="64" r="14" stroke="#10b981" stroke-width="4" fill="none" />
  <circle cx="64" cy="64" r="6" fill="#10b981" />

  <!-- Enlaces de Conexión del Núcleo -->
  <line x1="46" y1="64" x2="50" y2="64" stroke="#ff6b6b" stroke-width="3" />
  <line x1="82" y1="64" x2="78" y2="64" stroke="#ff6b6b" stroke-width="3" />
</svg>
